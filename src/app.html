<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c77f22" />
    <!-- Sets the theme before the first paint: the saved choice, else the system setting.
         src/lib/theme.ts applies the same rule once the page is running. -->
    <script>
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem('theme');
        } catch (e) {
          // Storage is unavailable: follow the system setting.
        }
        var dark =
          choice === 'dark' ||
          (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
